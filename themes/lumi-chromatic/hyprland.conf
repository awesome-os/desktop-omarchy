# Lumi Chromatic — Pure Crisp White & Prismatic Chrome Theme (Awesome-OS T2Desktop)
general {
  col.active_border = rgba(06b6d4ff) rgba(7c3aedff) rgba(ec4899ff) 45deg
  col.inactive_border = rgba(e2e8f0cc)
  border_size = 2
  gaps_in = 6
  gaps_out = 12
}

decoration {
  rounding = 12
  drop_shadow = true
  shadow_range = 24
  shadow_render_power = 3
  col.shadow = rgba(0f172a18)
  blur {
    enabled = true
    size = 8
    passes = 2
  }
}

misc {
  background_color = 0xffffff
}
