# Lumi White Dragon — T2Desktop Signature Hyprland Theme
# Obsidian background (#0d111a) + Electric Cyan (#38bdf8) / Sovereign Violet (#5865f2) borders

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10
    col.active_border = rgba(38bdf8ee) rgba(5865f2ee) 45deg
    col.inactive_border = rgba(0d111acc)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0d111acc)
    }
}

misc {
    background_color = rgb(0d111a)
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

group {
    col.border_active = rgba(38bdf8ee) rgba(5865f2ee) 45deg
    col.border_inactive = rgba(1e293baa)
}
